# Builds animview's core/ + runs all unit tests WITHOUT the Opus SDK (libwebp is
# fetched by CMake; WIC is part of Windows). The plugin DLL needs the SDK and is a
# local release step, so it is intentionally not built here.
#
# Uses MSVC (set up by msvc-dev-cmd) + Ninja rather than a pinned Visual Studio
# generator, so it isn't tied to a specific VS version on the runner image.

name: ci
on:
  push:
  pull_request:

jobs:
  animview:
    runs-on: windows-latest
    env:
      SRC_DIR: plugins/animview
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure (core + tests; Opus SDK absent -> DLL skipped)
        run: cmake -S "${{ env.SRC_DIR }}" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
